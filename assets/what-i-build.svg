    <text x="32" y="154" class="sans" font-size="12.5" font-weight="600" fill="#e6edf3">🧠 AI Research: LLM Hallucination Benchmarking</text>
  </g>
  <g class="item" style="animation-delay:0.55s">
    <rect x="20" y="174" width="385" height="32" rx="7" fill="#161b22" stroke="#21262d" />
    <text x="32" y="194" class="sans" font-size="12.5" font-weight="600" fill="#e6edf3">💻 Systems: Java Swing, Sockets, SQLite, Python</text>
