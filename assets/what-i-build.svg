<svg xmlns="http://www.w3.org/2000/svg" width="425" height="220" viewBox="0 0 425 220" role="img" aria-label="What I Build">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .item { opacity: 0; animation: slideIn 0.45s ease-out forwards; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  </style>
  <rect x="0.5" y="0.5" width="424" height="219" rx="12" fill="#0d1117" stroke="#30363d" />
  <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#38bdf8">// WHAT I BUILD</text>
  <line x1="20" y1="40" x2="405" y2="40" stroke="#21262d" />

  <g class="item" style="animation-delay:0.1s">
    <rect x="20" y="54" width="385" height="32" rx="7" fill="#161b22" stroke="#21262d" />
    <text x="32" y="74" class="sans" font-size="12.5" font-weight="600" fill="#e6edf3">☁️ Cloud &amp; IaC: Azure App Service + Terraform</text>
  </g>
  <g class="item" style="animation-delay:0.25s">
    <rect x="20" y="94" width="385" height="32" rx="7" fill="#161b22" stroke="#21262d" />
    <text x="32" y="114" class="sans" font-size="12.5" font-weight="600" fill="#e6edf3">🔐 Security Labs: Kali Linux, Wazuh SIEM/XDR</text>
  </g>
  <g class="item" style="animation-delay:0.4s">
