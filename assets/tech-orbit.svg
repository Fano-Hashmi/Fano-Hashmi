<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="Tech Orbit">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect x="0.5" y="0.5" width="859" height="209" rx="12" fill="#0d1117" stroke="#30363d" />
  <text x="24" y="30" class="mono" font-size="12" font-weight="700" fill="#34d399">// TECH ORBIT &amp; STACK</text>

  <!-- Orbit Atom on Left -->
  <g transform="translate(155, 112)">
    <circle r="18" fill="#161b22" stroke="#38bdf8" stroke-width="2" />
    <text y="4" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#38bdf8">CORE</text>
    <ellipse rx="78" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(-20)" />
    <ellipse rx="78" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(20)" />
    <ellipse rx="52" ry="52" fill="none" stroke="#21262d" stroke-dasharray="4 4" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
      <circle cx="72" cy="0" r="14" fill="#0078D4" />
      <text x="72" y="3.5" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#fff">AZ</text>
      <circle cx="-72" cy="0" r="14" fill="#7B42BC" />
      <text x="-72" y="3.5" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#fff">TF</text>
      <circle cx="0" cy="72" r="14" fill="#3776AB" />
      <text x="0" y="75.5" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#fff">PY</text>
      <circle cx="0" cy="-72" r="14" fill="#ED8B00" />
      <text x="0" y="-68.5" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#fff">JV</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
      <circle cx="48" cy="0" r="11" fill="#2496ED" />
      <text x="48" y="3" text-anchor="middle" class="mono" font-size="7" font-weight="700" fill="#fff">DK</text>
      <circle cx="-48" cy="0" r="11" fill="#557C94" />
      <text x="-48" y="3" text-anchor="middle" class="mono" font-size="7" font-weight="700" fill="#fff">KL</text>
    </g>
  </g>

  <!-- Chip Grid on Right -->
  <g transform="translate(310, 52)">
    <rect x="0" y="0" width="120" height="34" rx="8" fill="#161b22" stroke="#0078D4" />
    <text x="60" y="21" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Azure Cloud</text>
    <rect x="132" y="0" width="120" height="34" rx="8" fill="#161b22" stroke="#7B42BC" />
    <text x="192" y="21" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Terraform</text>
    <rect x="264" y="0" width="120" height="34" rx="8" fill="#161b22" stroke="#2496ED" />
    <text x="324" y="21" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Docker</text>
    <rect x="396" y="0" width="120" height="34" rx="8" fill="#161b22" stroke="#F05032" />
    <text x="456" y="21" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Git / CI-CD</text>

    <rect x="0" y="46" width="120" height="34" rx="8" fill="#161b22" stroke="#3776AB" />
    <text x="60" y="67" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Python</text>
    <rect x="132" y="46" width="120" height="34" rx="8" fill="#161b22" stroke="#ED8B00" />
    <text x="192" y="67" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Java / Swing</text>
    <rect x="264" y="46" width="120" height="34" rx="8" fill="#161b22" stroke="#00599C" />
    <text x="324" y="67" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">C++</text>
    <rect x="396" y="46" width="120" height="34" rx="8" fill="#161b22" stroke="#38bdf8" />
    <text x="456" y="67" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">SQLite / JDBC</text>

    <rect x="0" y="92" width="164" height="34" rx="8" fill="#161b22" stroke="#557C94" />
    <text x="82" y="113" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Kali Linux</text>
    <rect x="176" y="92" width="164" height="34" rx="8" fill="#161b22" stroke="#E95420" />
    <text x="258" y="113" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Ubuntu</text>
    <rect x="352" y="92" width="164" height="34" rx="8" fill="#161b22" stroke="#34d399" />
    <text x="434" y="113" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Wazuh SIEM/XDR</text>
  </g>
</svg>
