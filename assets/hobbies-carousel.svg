<svg xmlns="http://www.w3.org/2000/svg" width="425" height="220" viewBox="0 0 425 220" role="img" aria-label="Hobbies Carousel">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { opacity: 0; animation: story 12s infinite; }
    .c1 { animation-delay: 0s; }
    .c2 { animation-delay: 3s; }
    .c3 { animation-delay: 6s; }
    .c4 { animation-delay: 9s; }
    @keyframes story {
      0%, 2% { opacity: 0; }
      5%, 23% { opacity: 1; }
      26%, 100% { opacity: 0; }
    }
    .bar { transform-box: fill-box; transform-origin: left center; animation: fillbar 12s linear infinite; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 3s; }
    .b3 { animation-delay: 6s; }
    .b4 { animation-delay: 9s; }
    @keyframes fillbar {
      0% { transform: scaleX(0); }
      24% { transform: scaleX(1); }
      25%, 100% { transform: scaleX(0); }
    }
  </style>
  <rect x="0.5" y="0.5" width="424" height="219" rx="12" fill="#0d1117" stroke="#30363d" />
  <text x="20" y="30" class="mono" font-size="12" font-weight="700" fill="#f472b6">// HOBBIES &amp; FOCUS</text>
  <!-- Story Progress Bars -->
  <rect x="20" y="42" width="90" height="3" rx="1.5" fill="#21262d" />
  <rect x="118" y="42" width="90" height="3" rx="1.5" fill="#21262d" />
  <rect x="216" y="42" width="90" height="3" rx="1.5" fill="#21262d" />
  <rect x="314" y="42" width="90" height="3" rx="1.5" fill="#21262d" />
  <rect class="bar b1" x="20" y="42" width="90" height="3" rx="1.5" fill="#38bdf8" />
  <rect class="bar b2" x="118" y="42" width="90" height="3" rx="1.5" fill="#a78bfa" />
  <rect class="bar b3" x="216" y="42" width="90" height="3" rx="1.5" fill="#34d399" />
  <rect class="bar b4" x="314" y="42" width="90" height="3" rx="1.5" fill="#f472b6" />

  <g class="card c1">
    <text x="24" y="94" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">🛡️ Virtual Security Labs</text>
    <text x="24" y="126" class="sans" font-size="13.5" fill="#8b949e">Spinning up Kali Linux, Ubuntu &amp; Wazuh</text>
    <text x="24" y="148" class="sans" font-size="13.5" fill="#8b949e">VMs for packet capture &amp; defense testing.</text>
    <rect x="24" y="172" width="140" height="24" rx="6" fill="#161b22" stroke="#38bdf8" />
    <text x="94" y="188" text-anchor="middle" class="mono" font-size="11" fill="#38bdf8">VirtualBox · Kali</text>
  </g>
  <g class="card c2">
    <text x="24" y="94" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">🎮 Gaming &amp; Setup</text>
    <text x="24" y="126" class="sans" font-size="13.5" fill="#8b949e">Unwinding with PC gaming and customizing</text>
    <text x="24" y="148" class="sans" font-size="13.5" fill="#8b949e">minimalist cyber-themed desk aesthetics.</text>
    <rect x="24" y="172" width="140" height="24" rx="6" fill="#161b22" stroke="#a78bfa" />
    <text x="94" y="188" text-anchor="middle" class="mono" font-size="11" fill="#a78bfa">PC Gaming · Decor</text>
  </g>
  <g class="card c3">
    <text x="24" y="94" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">🏋️ Gym &amp; Discipline</text>
    <text x="24" y="126" class="sans" font-size="13.5" fill="#8b949e">5:30 AM starts, structured upper/lower</text>
    <text x="24" y="148" class="sans" font-size="13.5" fill="#8b949e">training splits &amp; high-protein nutrition.</text>
    <rect x="24" y="172" width="140" height="24" rx="6" fill="#161b22" stroke="#34d399" />
    <text x="94" y="188" text-anchor="middle" class="mono" font-size="11" fill="#34d399">Consistency · 5:30AM</text>
  </g>
  <g class="card c4">
    <text x="24" y="94" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">🎬 Action Cinema</text>
    <text x="24" y="126" class="sans" font-size="13.5" fill="#8b949e">Big fan of tight choreography and</text>
    <text x="24" y="148" class="sans" font-size="13.5" fill="#8b949e">neo-noir action franchises like John Wick.</text>
    <rect x="24" y="172" width="140" height="24" rx="6" fill="#161b22" stroke="#f472b6" />
    <text x="94" y="188" text-anchor="middle" class="mono" font-size="11" fill="#f472b6">Movies · Storytelling</text>
  </g>
</svg>
